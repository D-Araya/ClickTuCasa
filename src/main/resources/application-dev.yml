# ---------------------------------------------------------------------------
# Local development profile.
#
# It holds ONLY what is specific to developing on a laptop: verbose SQL and
# a fully enabled Swagger UI. The datasource itself lives in
# application.yml, read from environment variables, so that the API also
# boots correctly under any other profile.
# ---------------------------------------------------------------------------
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operationsSorter: method
